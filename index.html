<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Theme color tints the mobile browser chrome to match the night sky. -->
    <meta name="theme-color" content="#080712" />

    <!-- Social preview / tab title. Edit copy in src/config/content.ts; this is
         a static fallback so the tab reads nicely before React mounts. -->
    <title>Under One Sky</title>
    <meta
      name="description"
      content="A send-off, written in lanterns — counting down until you're back under our sky."
    />

    <!-- Fonts: Fraunces (display), Hanken Grotesk (body), Space Mono (labels).
         preconnect first so they load fast; display=swap avoids invisible text. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500;1,9..144,600&family=Hanken+Grotesk:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
